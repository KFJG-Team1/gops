# 역할: AWS/EKS에 적용할 Kubernetes manifest 조합입니다.
# 사용: PLACEHOLDER를 실제 AWS 값으로 바꾼 뒤 kubectl apply -k로 적용합니다.
# 주의: 현재 stream runtime은 Python market-processor pod입니다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/app
  - secretstore-aws-secrets-manager.yaml
  - externalsecret-openai.yaml
  - externalsecret-sec-fundamentals.yaml
  - cronjob-sec-fundamentals-sync.yaml

patches:
  - path: configmap-aws-patch.yaml
  - path: serviceaccount-irsa-aws-patch.yaml

images:
  - name: YOUR_ECR_REPOSITORY/gops-market-ingestor
    newName: 993099901407.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-market-ingestor
    newTag: 0c876e9
  - name: YOUR_ECR_REPOSITORY/gops-market-processor
    newName: 993099901407.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-market-processor
    newTag: 0c876e9
  - name: YOUR_ECR_REPOSITORY/gops-market-storage
    newName: 993099901407.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-market-storage
    newTag: 0c876e9
  - name: YOUR_ECR_REPOSITORY/gops-api-server
    newName: 993099901407.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-api-server
    newTag: 0c876e9
  - name: YOUR_ECR_REPOSITORY/gops-frontend
    newName: 993099901407.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-frontend
    newTag: 0c876e9
  - name: YOUR_ECR_REPOSITORY/gops-order-worker
    newName: 993099901407.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-order-worker
    newTag: 0c876e9
  - name: YOUR_ECR_REPOSITORY/gops-kis-adapter
    newName: 993099901407.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-kis-adapter
    newTag: 0c876e9
  - name: YOUR_ECR_REPOSITORY/gops-agent-orchestrator
    newName: 993099901407.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-agent-orchestrator
    newTag: 0c876e9
