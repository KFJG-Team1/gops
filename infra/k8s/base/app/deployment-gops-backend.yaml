# 역할: GOPS chart REST API와 WebSocket API를 EKS에 배포합니다.
# 사용: Redis 최신/live 데이터와 ClickHouse candle 데이터를 프론트에 제공합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gops-backend
  namespace: alfaka-market-data
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gops-backend
  template:
    metadata:
      labels:
        app: gops-backend
    spec:
      serviceAccountName: alfaka-market-data-sa
      containers:
        - name: gops-backend
          image: YOUR_ECR_REPOSITORY/gops-api-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: GOPS_SIMULATOR_URL
              value: http://gops-simulator:8765
            - name: GOPS_SIMULATOR_WS_BASE_URL
              value: ws://gops-simulator:8765
          envFrom:
            - configMapRef:
                name: alfaka-market-data-config
            - secretRef:
                name: alfaka-clickhouse-secret
                optional: true
            - secretRef:
                name: alfaka-openai-secret
                optional: true
            - secretRef:
                name: alfaka-auth-secret
                optional: true
            - secretRef:
                name: alfaka-order-db-secret
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
